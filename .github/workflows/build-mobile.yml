name: Build Mobile App

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile a signed Android release APK locally and attach it as a downloadable artifact.
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias dockerview \
            -storepass android -keypass android \
            -dname "CN=DockerView, OU=Mobile, O=DockerView, L=Unknown, S=Unknown, C=US"

      - name: Configure release signing
        run: |
          {
            echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
            echo "MYAPP_UPLOAD_KEY_ALIAS=dockerview"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=android"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=android"
          } >> android/gradle.properties

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerview-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Optional cloud builds (Android + iOS) via EAS. Requires an `EXPO_TOKEN` repository secret.
  # Configure Apple credentials in your EAS project for iOS builds.
  eas-build:
    name: EAS Build (Android & iOS)
    runs-on: ubuntu-latest
    if: ${{ secrets.EXPO_TOKEN != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build with EAS
        run: eas-cli build --platform all --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
